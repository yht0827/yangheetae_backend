spring:
  datasource:
    url: jdbc:h2:mem:transfer-test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: INFO
